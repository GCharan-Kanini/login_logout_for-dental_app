stack: dotnet
install_cmd: P=$(find . \( -name .git -o -name .propel -o -name bin -o -name obj -o
  -name node_modules \) -prune -o \( -name '*.csproj' -o -name '*.fsproj' \) ! -iname
  '*test*' -print | head -n 1) && { [ -n "$P" ] || { echo "no .NET project exists
  to add packages to; drop the dependencies or add the project first" >&2; exit 1;
  }; } && dotnet add "$P" package Microsoft.EntityFrameworkCore.SqlServer && dotnet
  add "$P" package Microsoft.EntityFrameworkCore.InMemory && dotnet add "$P" package
  xunit && dotnet add "$P" package dotnet-ef && find . \( -name .git -o -name .propel
  -o -name bin -o -name obj -o -name node_modules \) -prune -o \( -name '*.csproj'
  -o -name '*.fsproj' \) -print | while IFS= read -r p; do dotnet restore "$p" -v
  q || exit 1; done && if [ -f .config/dotnet-tools.json ]; then dotnet tool restore;
  fi
syntax_cmd: find . \( -name .git -o -name .propel -o -name bin -o -name obj -o -name
  node_modules \) -prune -o \( -name '*.csproj' -o -name '*.fsproj' \) ! -iname '*test*'
  -print | while IFS= read -r p; do dotnet build "$p" -nologo -v q -nodeReuse:false
  -p:UseSharedCompilation=false -clp:ErrorsOnly || exit 1; done
build_cmd: find . \( -name .git -o -name .propel -o -name bin -o -name obj -o -name
  node_modules \) -prune -o \( -name '*.csproj' -o -name '*.fsproj' \) ! -iname '*test*'
  -print | while IFS= read -r p; do dotnet build "$p" -nologo -v q -nodeReuse:false
  -p:UseSharedCompilation=false || exit 1; done
test_cmd: rm -rf .propel/tr; find . \( -name .git -o -name .propel -o -name bin -o
  -name obj -o -name node_modules \) -prune -o \( -iname '*test*.csproj' -o -iname
  '*test*.fsproj' \) -print | while IFS= read -r p; do dotnet test "$p" -nologo -v
  q -nodeReuse:false -p:UseSharedCompilation=false --logger "trx;LogFilePrefix=r"
  --results-directory .propel/tr; done; cat .propel/tr/*.trx
test_selector: rm -rf .propel/tr; find . \( -name .git -o -name .propel -o -name bin
  -o -name obj -o -name node_modules \) -prune -o \( -iname '*test*.csproj' -o -iname
  '*test*.fsproj' \) -print | while IFS= read -r p; do dotnet test "$p" -nologo -v
  q -nodeReuse:false -p:UseSharedCompilation=false --logger "trx;LogFilePrefix=r"
  --results-directory .propel/tr --filter "{path}"; done; cat .propel/tr/*.trx
dependency_file: packages.lock.json
runtime_version: '8.0'
